name: lgbm_baseline_noC
description: >
  Baseline tabular TANPA C1-C14. Ini pembanding jujur untuk graph features di
  Fase 4: C-features sudah merupakan counting di level klien, sehingga menguji
  graph hanya terhadap baseline_full akan mengecilkan lift secara artifisial.
  Selisih noC vs full mengukur seberapa besar sinyal entity-level yang sudah
  disediakan Vesta.

feature_blocks: [base, derived, label_encode, frequency_encode, aggregations, D, V, id]

seed: 42

# Lihat catatan backend di lgbm_baseline_full.yaml. Kedua varian WAJIB memakai
# backend dan hyperparameter identik supaya perbandingannya apple-to-apple.
backend: xgboost

params:
  objective: binary
  metric: auc
  boosting_type: gbdt
  learning_rate: 0.05
  num_leaves: 128
  min_data_in_leaf: 100
  feature_fraction: 0.7
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l1: 0.1
  lambda_l2: 0.1
  max_bin: 255
  use_missing: true
  zero_as_missing: false
  scale_pos_weight: 1.0
  verbosity: -1

params_xgb:
  objective: binary:logistic
  eval_metric: auc
  tree_method: hist
  learning_rate: 0.05
  max_depth: 7
  min_child_weight: 100
  colsample_bytree: 0.7
  subsample: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  max_bin: 256
  scale_pos_weight: 1.0

train:
  num_boost_round: 3000
  early_stopping_rounds: 100
  log_every: 200
